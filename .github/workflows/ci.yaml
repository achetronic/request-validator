name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Go version from go.mod
        id: read_go_version
        run: |
          go_version=$(grep -E "^go [0-9]" go.mod | awk '{print $2}')
          echo "go_version=${go_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ steps.read_go_version.outputs.go_version }}'

      - name: go vet
        run: go vet ./...

      - name: install swag v2
        run: go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5

      - name: openapi spec is up-to-date
        run: |
          # Regenerate to a scratch dir and diff against the committed one.
          # Fails the build if the committed spec drifted from the source.
          cp -r internal/adminapi/docs /tmp/docs-before
          make swagger
          diff -u /tmp/docs-before/swagger.json internal/adminapi/docs/swagger.json

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: build (smoke)
        run: |
          CGO_ENABLED=0 go build -buildvcs=false ./cmd

      - name: e2e (binary)
        run: make e2e
