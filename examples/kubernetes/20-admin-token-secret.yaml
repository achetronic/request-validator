# Bearer token the admin API will require on every request.
#
# DO NOT apply this file as-is in production — the token below is a
# placeholder. Replace it with a real one before applying, or (better)
# generate the Secret out-of-band:
#
#   kubectl -n request-validator create secret generic request-validator-admin \
#     --from-literal=token=$(openssl rand -hex 32)
#
# Rotation: overwrite the Secret with a new token and the running pods
# will pick it up live (fsnotify on the mounted file).
apiVersion: v1
kind: Secret
metadata:
  name: request-validator-admin
  namespace: request-validator
type: Opaque
stringData:
  token: "REPLACE-ME-WITH-A-LONG-RANDOM-TOKEN"
