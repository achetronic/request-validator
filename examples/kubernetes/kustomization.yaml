# `kubectl apply -k examples/kubernetes/` applies all of these in
# one shot. Update `newTag` to the version you want to deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-rbac.yaml
  - 20-admin-token-secret.yaml
  - 30-policy-configmap.yaml
  - 40-deployment.yaml

# Pin the image to a specific version. Override per-environment by
# building on top of this kustomization with `kustomize edit set image`
# in your overlay.
images:
  - name: ghcr.io/achetronic/request-validator
    newTag: latest
