# Istio wiring for request-validator.
#
# Three pieces fit together below:
#
#   - An extensionProvider in MeshConfig declares the ext-authz HTTP
#     provider. We deliberately omit includeRequestHeadersInCheck here
#     because the EnvoyFilter further down rewrites the allowed-header
#     list on the protected workload's sidecar.
#
#   - An AuthorizationPolicy with action: CUSTOM delegates the matched
#     paths to the validator. Everything else stays under the existing
#     Istio policies for that service.
#
#   - An EnvoyFilter merges into the ext-authz filter generated by the
#     provider and pins allowed_headers to ".*" on this workload's
#     sidecar, with a small disallow list for mesh-internal noise.
#
# Replace the placeholders before applying:
#   <NAMESPACE>      namespace where request-validator runs.
#   <WORKLOAD_NS>    namespace where the workload being protected runs
#                    (e.g. the Keycloak namespace).
#   <WORKLOAD_NAME>  app.kubernetes.io/name (or equivalent) label of
#                    the workload that the AuthorizationPolicy targets.


# The provider declaration. Cluster-wide; one entry per validator deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio
  namespace: istio-system
data:
  mesh: |-
    extensionProviders:
    - name: request-validator
      envoyExtAuthzHttp:
        service: request-validator.<NAMESPACE>.svc.cluster.local
        port: 8080
        failOpen: false
        timeout: 2s
        # Forward the request body so policies can inspect it (e.g.
        # validate `redirect_uris` in a DCR POST). Only maxRequestBytes
        # and allowPartialMessage apply to envoyExtAuthzHttp;
        # packAsBytes is gRPC-only.
        # Ref: https://istio.io/latest/docs/reference/config/istio.mesh.v1alpha1/
        includeRequestBodyInCheck:
          maxRequestBytes: 1048576
          allowPartialMessage: false
        # Diagnostics the validator stamps on every response. Sending
        # them upstream on allow lets the protected service log which
        # rule cleared the request.
        headersToUpstreamOnAllow:
          - x-rv-result
          - x-rv-rule
          - x-rv-reason
          - x-rv-dry-run
        # And on deny so the client (or the operator looking at Envoy's
        # response) can see why.
        headersToDownstreamOnDeny:
          - content-type
          - x-rv-result
          - x-rv-rule
          - x-rv-reason
          - x-rv-dry-run

---

# The AuthorizationPolicy that hands matched traffic to the validator.
# Scoped to the workload being protected. Only the listed paths are sent
# to the validator; the rest of the service keeps the existing Istio
# policies untouched.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: request-validator-ext-authz
  namespace: <WORKLOAD_NS>
spec:
  action: CUSTOM
  provider:
    name: request-validator
  selector:
    matchLabels:
      app.kubernetes.io/name: <WORKLOAD_NAME>
  rules:
    - to:
        - operation:
            # Adjust to the endpoints you want to gate. The example below
            # targets Keycloak Dynamic Client Registration on every realm.
            #
            # Path matcher syntax (Istio v1):
            #   `{*}`  matches exactly one path segment (no slashes).
            #   `{**}` matches zero or more path segments (slashes allowed).
            # Plain `*` only matches a single segment, so a pattern like
            # `/realms/*/clients-registrations/*` would NOT match the real
            # OIDC DCR endpoint
            # `/realms/<realm>/clients-registrations/openid-connect`.
            paths:
              - /realms/{*}/clients-registrations
              - /realms/{*}/clients-registrations/{**}

---

# Forward every meaningful header to the validator.
#
# Listing them one by one in `includeRequestHeadersInCheck` of the
# extensionProvider would force a mesh-wide change whenever a policy
# starts looking at a new header. Pinning the allowed-headers list to
# ".*" on this workload's sidecar lets the policy author add
# `request.header['x-foo']` without coordinating with whoever owns the
# MeshConfig.
#
# MERGE applies on top of the ext_authz filter Istio already generated
# from the extensionProvider - do not use ADD here.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: request-validator-all-headers
  namespace: <WORKLOAD_NS>
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: <WORKLOAD_NAME>
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            allowed_headers:
              patterns:
                - safe_regex:
                    regex: ".*"
            # Drop mesh-internal noise that doesn't help decisions and only
            # inflates every check payload. Trim more as you go.
            #
            # x-forwarded-client-cert is dropped because we don't use
            # peer mTLS identity today. If you start writing rules that
            # read `request.headers['x-forwarded-client-cert']`, remove
            # that line.
            #
            # NOTE: ignore_case is intentionally NOT set on any of these
            # patterns. Envoy rejects the listener if ignore_case appears
            # inside safe_regex (it's only valid on string_match/prefix/exact
            # before the StringMatcher refactor), and HTTP/2 + Envoy
            # normalise header names to lowercase anyway, so it is
            # redundant for prefix/exact too.
            disallowed_headers:
              patterns:
                - prefix: "x-envoy-"
                - prefix: "x-b3-"
                - exact: "x-request-id"
                - exact: "x-forwarded-client-cert"
